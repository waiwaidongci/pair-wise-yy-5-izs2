<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦纹样排版台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #71675c; }
    input, select { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 280px 1fr 320px; gap: 16px; padding: 16px; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 720px); border: 6px solid #72533c; background: #72533c; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: pointer; border-radius: 2px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch { aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; }
    .swatch.active { border-color: #1f1b16; }
    .blocks { display: grid; gap: 8px; }
    .stats { display: grid; gap: 8px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e1d5c5; padding: 6px 0; }
    .preview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; border: 1px solid #d9cdbc; padding: 6px; margin-top: 8px; }
    .mini { aspect-ratio: 1; border-radius: 2px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .warning { color: #a03a2e; font-weight: 800; }
    .tension { grid-column: 1 / -1; }
    .tension-grid { display: grid; grid-template-columns: 260px 280px 1fr; gap: 16px; }
    .tension h3 { margin: 10px 0 6px; font-size: 15px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid #e1d5c5; padding: 6px 8px; text-align: left; vertical-align: top; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 800; }
    .tag.ok { background: #dcead6; color: #2f5d2a; }
    .tag.recheck { background: #f6d9d2; color: #a03a2e; }
    .tag.unmeasured { background: #e8e2d8; color: #71675c; }
    .hint { color: #76695e; font-size: 12px; margin: 4px 0; }
    .msg-ok { color: #2f5d2a; font-weight: 800; }
    .msg-err { color: #a03a2e; font-weight: 800; }
    .archive-item { border-bottom: 1px solid #e1d5c5; padding: 6px 0; font-size: 13px; }
    @media (max-width: 1000px) { header { display: block; } .app { grid-template-columns: 1fr; } .tension-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>手工织锦纹样排版台</h1><div>绘制经纬网格纹样，统计色线用量并保存方案。</div></div>
    <div class="toolbar"><button id="saveBtn">保存方案</button><button id="exportBtn" class="secondary">导出JSON</button></div>
  </header>
  <main class="app">
    <aside class="panel">
      <h2>画布</h2>
      <label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36">
      <label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32">
      <button id="newBtn">新建网格</button>
      <h2>色线库</h2>
      <div class="palette" id="palette"></div>
      <h2>基础纹样块</h2>
      <div class="blocks">
        <button data-block="dot" class="secondary">单点</button>
        <button data-block="cross" class="secondary">十字</button>
        <button data-block="diamond" class="secondary">小菱形</button>
      </div>
    </aside>
    <section class="panel"><div class="grid" id="grid"></div></section>
    <aside class="panel">
      <h2>操作</h2>
      <div class="toolbar"><button id="undoBtn" class="secondary">撤销</button><button id="redoBtn" class="secondary">重做</button></div>
      <p>点击填色，按住拖动可连续填色。</p>
      <h2>用色统计</h2>
      <div class="stats" id="stats"></div>
      <h2>重复单元预览</h2>
      <div class="preview" id="preview"></div>
      <h2>断线风险</h2>
      <div id="risk"></div>
    </aside>
    <section class="panel tension">
      <h2>张力巡查与上机放行</h2>
      <div class="tension-grid">
        <div>
          <h3>机台与经区</h3>
          <label>机数</label><input id="machines" type="number" min="1" max="12" value="2">
          <label>经区数</label><input id="zoneCount" type="number" min="2" max="12" value="4">
          <div id="baselines"></div>
          <p class="hint">改动机数、经区划分或基准会使已发许可失效，并按新参数复算。</p>
        </div>
        <div>
          <h3>巡查登记</h3>
          <label>经区</label><select id="zoneSel"></select>
          <label>张力读数 (cN)</label><input id="tension" type="number" step="0.1" min="0">
          <label>环境湿度 (%)</label><input id="humidity" type="number" step="1" min="0" max="100" value="65">
          <label>巡查人 / 复核人</label><input id="inspector" type="text" placeholder="姓名">
          <label>处理说明</label><input id="note" type="text" placeholder="如：已调整左侧张力架">
          <div class="toolbar">
            <button id="patrolBtn">登记巡查</button>
            <button id="recheckBtn" class="secondary">复核登记（须换人）</button>
          </div>
          <p id="inspMsg"></p>
        </div>
        <div>
          <h3>经区状态</h3>
          <div id="zoneStatus"></div>
          <h3>上机许可</h3>
          <button id="permitBtn">生成上机许可</button>
          <p id="permitMsg"></p>
          <h3>放行档案</h3>
          <div id="archive"></div>
          <h3>读数履历</h3>
          <div id="history"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="js/inspection.js"></script>
  <script src="js/release.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
