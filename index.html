<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦纹样排版台 · 张力巡查与上机放行</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 24px; }
    h2 { font-size: 17px; margin: 16px 0 8px; }
    h3 { font-size: 14px; margin: 12px 0 6px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; }
    button:disabled { background: #b7aaa0; cursor: not-allowed; }
    button.secondary { background: #71675c; }
    input, select, textarea { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 260px 1fr 340px; gap: 16px; padding: 16px; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 640px); border: 6px solid #72533c; background: #72533c; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: pointer; border-radius: 2px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch { aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; padding: 0; }
    .swatch.active { border-color: #1f1b16; }
    .blocks { display: grid; gap: 8px; }
    .stats { display: grid; gap: 8px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e1d5c5; padding: 6px 0; }
    .preview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; border: 1px solid #d9cdbc; padding: 6px; margin-top: 8px; }
    .mini { aspect-ratio: 1; border-radius: 2px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .warning, .cellReason { color: #a03a2e; font-weight: 800; }
    .muted { color: #8c7f72; font-size: 13px; }
    /* 张力巡查 */
    .tensionWrap { margin-top: 16px; display: grid; grid-template-columns: 360px 1fr; gap: 16px; }
    .paramGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .baseRow { display: grid; grid-template-columns: 1fr 84px auto; gap: 6px; align-items: center; margin-bottom: 6px; }
    .baseRow input { padding: 6px; text-align: right; }
    .baseRow small { color: #8c7f72; }
    .baseRow em { font-style: normal; color: #76695e; font-size: 12px; }
    .recheck-hint { display: none; font-size: 13px; margin: 8px 0; }
    .recheck-hint.show-warn { display: block; color: #a03a2e; font-weight: 700; }
    .recheck-hint.show-ok { display: block; color: #355b38; font-size: 13px; }
    .hist { border: 1px solid #e1d5c5; border-radius: 6px; padding: 8px; margin-bottom: 6px; background: #fff; font-size: 13px; }
    .hist-current { border-left: 4px solid #355b38; }
    .hist .note { color: #76695e; margin-top: 4px; }
    .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #e1d5c5; margin-right: 4px; color: #5d5348; }
    .tag-recheck { background: #f6dcd2; color: #a03a2e; }
    .tag-current { background: #d8e5d6; color: #355b38; }
    .tag-old { background: #eee6db; }
    .verdict { border-radius: 8px; padding: 10px 12px; font-weight: 800; margin-bottom: 10px; font-size: 14px; }
    .verdict.ok { background: #d8e5d6; color: #27452b; }
    .verdict.pending { background: #f3e6c8; color: #7a5c1c; }
    .verdict.fail { background: #f6dcd2; color: #a03a2e; }
    table.zoneTable { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
    .zoneTable th, .zoneTable td { border: 1px solid #e1d5c5; padding: 6px 8px; text-align: center; }
    .zoneTable th { background: #f0e6d8; }
    .zoneTable tbody tr { cursor: pointer; }
    .zoneTable tbody tr.sel { outline: 2px solid #8d3e37; }
    .zoneTable small { color: #8c7f72; font-weight: 400; }
    .badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 12px; font-weight: 800; }
    .badge.pass { background: #d8e5d6; color: #27452b; }
    .badge.fail { background: #f6dcd2; color: #a03a2e; }
    .badge.none { background: #e8e0d4; color: #7a6f63; }
    .cellReason { font-size: 11px; font-weight: 400; margin-top: 3px; }
    .permitStatus { padding: 9px 11px; border-radius: 8px; font-weight: 800; font-size: 13px; margin-bottom: 8px; }
    .permitStatus.valid { background: #d8e5d6; color: #27452b; }
    .permitStatus.invalid { background: #f6dcd2; color: #a03a2e; }
    .permitCard { border: 1px solid #d9cdbc; border-radius: 8px; padding: 10px; background: #fff; font-size: 13px; display: grid; gap: 5px; }
    .permitPre { max-height: 260px; overflow: auto; background: #fff; border: 1px solid #e1d5c5; border-radius: 6px; padding: 8px; font-size: 11px; }
    .flash { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); background: #2d2620; color: #fff; padding: 11px 18px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; max-width: 80vw; z-index: 10; }
    .flash.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .flash.err { background: #a03a2e; }
    .flash.warn { background: #9a6b1e; }
    .flash.ok { background: #27452b; }
    @media (max-width: 1100px) { header { display: block; } .app, .tensionWrap { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>手工织锦纹样排版台 · 张力巡查与上机放行</h1>
      <div>绘制经纬网格纹样、统计色线用量；按经区巡查经纱张力，合格后整幅签发上机许可。</div></div>
    <div class="toolbar"><button id="saveBtn">保存方案</button><button id="exportBtn" class="secondary">导出JSON</button></div>
  </header>
  <main class="app">
    <aside class="panel">
      <h2>画布</h2>
      <label>经向列数（改动会改变经区跨列）</label><input id="cols" type="number" value="18" min="6" max="36">
      <label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32">
      <button id="newBtn">新建网格</button>
      <h2>色线库</h2>
      <div class="palette" id="palette"></div>
      <h2>基础纹样块</h2>
      <div class="blocks">
        <button type="button" data-block="dot" class="secondary">单点</button>
        <button type="button" data-block="cross" class="secondary">十字</button>
        <button type="button" data-block="diamond" class="secondary">小菱形</button>
      </div>
    </aside>
    <section class="panel"><div class="grid" id="grid"></div></section>
    <aside class="panel">
      <h2>操作</h2>
      <div class="toolbar"><button id="undoBtn" class="secondary">撤销</button><button id="redoBtn" class="secondary">重做</button></div>
      <p class="muted">点击填色，按住拖动可连续填色。</p>
      <h2>用色统计</h2>
      <div class="stats" id="stats"></div>
      <h2>重复单元预览</h2>
      <div class="preview" id="preview"></div>
      <h2>断线风险</h2>
      <div id="risk"></div>
    </aside>
  </main>

  <section class="tensionWrap" style="padding: 0 16px 24px;">
    <div class="panel">
      <h2>上机参数</h2>
      <div class="paramGrid">
        <div>
          <label>机数（台）</label>
          <input id="looms" type="number" value="1" min="1" max="999">
        </div>
        <div>
          <label>经区数量</label>
          <input id="zoneCount" type="number" value="4" min="1" max="36">
        </div>
      </div>
      <button type="button" id="applyZonesBtn" class="secondary" style="margin-top:8px;">应用经区划分</button>
      <p class="muted">改动机数、经区划分或基准：现行许可立即失效，并按新参数复算。</p>
      <h2>各区基准张力</h2>
      <div id="baselineEditor"></div>
    </div>

    <div class="panel">
      <div id="verdictBanner" class="verdict pending"></div>
      <table class="zoneTable">
        <thead><tr>
          <th>经区</th><th>基准(cN)</th><th>实测(cN)</th><th>偏离</th><th>档数</th><th>相邻最大档差</th><th>巡查人</th><th>判定</th>
        </tr></thead>
        <tbody id="zoneRows"></tbody>
      </table>
      <p class="muted" style="margin:6px 0 0;">规则：读数偏离该区基准 8%，或与相邻区相差超过 3 档（每 5 cN 一档），该区转待复检；整幅有待复检或未实测区时不能生成上机许可。点击行选择经区。</p>
    </div>

    <div class="panel">
      <h2>张力巡查登记</h2>
      <label>经区</label>
      <select id="zoneSelect"></select>
      <div id="recheckHint" class="recheck-hint"></div>
      <div class="paramGrid">
        <div><label>张力读数 (cN)</label><input id="reading" type="number" step="0.1" min="0.1" placeholder="本次实测"></div>
        <div><label>环境湿度 (%RH)</label><input id="humidity" type="number" step="0.1" min="0" max="100" placeholder="如 62"></div>
      </div>
      <label>巡查人</label><input id="inspector" type="text" placeholder="姓名（复检须换他人）">
      <label>处理说明</label>
      <textarea id="note" rows="2" placeholder="如：换班口头交接不作依据；某列松经、已调整夹纱器等"></textarea>
      <button type="button" id="submitReadingBtn" style="margin-top:10px;width:100%;">登记巡查读数</button>
      <h2>本经区履历</h2>
      <div id="zoneHistory"></div>
    </div>

    <div class="panel">
      <h2>上机放行</h2>
      <label>放行人</label><input id="issuer" type="text" placeholder="签发许可的负责人">
      <button type="button" id="permitGateBtn" style="margin-top:8px;width:100%;">生成上机许可</button>
      <div id="permitPanel" style="margin-top:12px;"></div>
    </div>
  </section>

  <div id="flashMsg" class="flash"></div>

  <script src="inspection.js"></script>
  <script src="release.js"></script>
  <script src="app.js"></script>
</body>
</html>
